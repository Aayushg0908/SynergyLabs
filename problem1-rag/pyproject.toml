[project]
name = "rag-app"
version = "0.1.0"
description = "Cost-efficient RAG service on pgvector with retrieval/answer/cost evaluation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "groq>=0.11",
    "google-genai>=1.0",
    "numpy>=1.26",
    "tenacity>=8.0",
]

[project.scripts]
rag = "rag_app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
