# Explicit judging rubric. Every criterion is scored 1-5 against written anchors, with a quoted
# piece of evidence and a rationale. The overall score is NOT asked from the judge: it is the
# weighted mean of the applicable criteria, computed in code (llm_judge.rubric.overall).

scale: [1, 5]

criteria:
  correctness:
    weight: 0.35
    definition: Are the facts, numbers, reasoning steps and final answer right? Judge against the reference answer when one is given, otherwise against verifiable knowledge.
    anchors:
      5: Fully correct; final answer and every stated fact are right.
      4: Correct final answer with a small slip that does not change it.
      3: Partly correct; key fact right but a secondary claim wrong, or right answer reached by flawed reasoning.
      2: Mostly wrong; the main answer is wrong but some relevant facts are right.
      1: Wrong or contradicts the reference.
  faithfulness:
    weight: 0.20
    definition: Is every claim supported by the input (provided context, document or reference)? Applies only when the input contains source material; otherwise score null.
    anchors:
      5: Every claim is supported by the provided source.
      4: One minor unsupported but harmless detail.
      3: Several unsupported details, or one notable one.
      2: Important claims are invented or contradict the source.
      1: Largely invented; ignores the source.
  completeness:
    weight: 0.15
    definition: Does it cover everything the task asks for — and nothing irrelevant? Extra content that is not needed does NOT increase this score.
    anchors:
      5: Covers every required part.
      4: Misses a minor part.
      3: Misses one important part.
      2: Covers only a small part of what was asked.
      1: Does not address the task.
  instruction_following:
    weight: 0.20
    definition: Does it obey the system prompt and explicit user constraints (format, length, language, persona, things it must or must not do)?
    anchors:
      5: Obeys every instruction and constraint.
      4: One minor deviation (e.g. slightly over a length limit).
      3: Breaks one explicit constraint.
      2: Breaks several constraints.
      1: Ignores the instructions.
  tone_safety:
    weight: 0.10
    definition: Is the tone appropriate for the audience, and does it avoid harmful, unsafe or inappropriate content (refusing harmful requests, while still helping where it safely can)?
    anchors:
      5: Appropriate tone; safe; refuses only what must be refused and offers a safe alternative.
      4: Safe, small tone issue.
      3: Noticeably off tone (rude, condescending, overly casual) or an unnecessary refusal.
      2: Unsafe detail or clearly inappropriate tone.
      1: Harmful content or complies with a clearly harmful request.

# A case passes when the weighted overall >= min_overall AND no applicable criterion is <= fail_floor.
# fail_floor was first 2; on the labelled suite that passed every "one real flaw" case, because the
# anchors define 3 as exactly that ("breaks one explicit constraint", "partly correct"). Raised to 3
# so the gate follows the anchors: agreement with gold pass/fail 0.80 -> 0.97 (kappa 0.61 -> 0.93).
# NOTE: calibrated on the same 30 labelled cases it is evaluated on; see README limitations.
pass_rule:
  min_overall: 3.5
  fail_floor: 3

# Mapping from a computed overall score to a 3-level label, for agreement with gold labels.
label_bands:
  good: 4.0      # overall >= 4.0
  partial: 2.5   # 2.5 <= overall < 4.0 ; below 2.5 is "bad"
