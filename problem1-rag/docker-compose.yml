services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag   # local dev only; override via env in any real deployment
      POSTGRES_DB: rag
    ports:
      - "5544:5432"   # 5544 on the host so it doesn't clash with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
