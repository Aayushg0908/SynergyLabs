[project]
name = "llm-judge"
version = "0.1.0"
description = "LLM-as-judge evaluation pipeline with measured bias mitigation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.0",
    "python-dotenv>=1.0",
]

[project.scripts]
judge = "llm_judge.cli:main"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_judge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
