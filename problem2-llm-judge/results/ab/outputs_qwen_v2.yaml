  input: A train travels 180 km in 2.5 hours. What is its average speed in km/h?
  system_prompt: ''
  model_output: 'To find the average speed, use the formula:


    $$ \text{Average Speed} = \frac{\text{Total Distance}}{\text{Total Time}} $$


